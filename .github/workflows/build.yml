name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: unzip DonutCore-source.zip
      - run: mvn -B package
        working-directory: DonutCore
      - uses: actions/upload-artifact@v4
        with:
          name: DonutCore
          path: DonutCore/target/DonutCore-*.jar
